<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepForge — Interview Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0b;
            --bg2: #141414;
            --card: #1a1a1a;
            --card-hover: #222222;
            --border: #2a2a2a;
            --fg: #e8e8e8;
            --muted: #777;
            --accent: #d4a039;
            --accent-dim: rgba(212,160,57,0.12);
            --success: #10b981;
            --danger: #f43f5e;
            --easy: #10b981;
            --medium: #f59e0b;
            --hard: #f43f5e;
            --quick: #06b6d4;
            --regular: #8b5cf6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.025) 1px, transparent 0);
            background-size: 28px 28px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1,h2,h3,h4,h5 { font-family: 'Space Grotesk', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        /* Sidebar */
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: 250px;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            z-index: 40; display: flex; flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .sidebar-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 35; backdrop-filter: blur(2px);
        }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 11px 20px;
            color: var(--muted); cursor: pointer; transition: all 0.2s;
            border-left: 3px solid transparent; font-size: 14px; font-weight: 500;
        }
        .nav-item:hover { color: var(--fg); background: rgba(255,255,255,0.03); }
        .nav-item.active {
            color: var(--accent); border-left-color: var(--accent);
            background: var(--accent-dim);
        }
        .nav-item i { width: 20px; text-align: center; font-size: 15px; }

        /* Main */
        .main { margin-left: 250px; min-height: 100vh; padding: 32px 40px; }

        /* Cards */
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; transition: all 0.2s;
        }
        .card:hover { border-color: #3a3a3a; }
        .stat-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px 24px; position: relative; overflow: hidden;
        }
        .stat-card::after {
            content: ''; position: absolute; top: -20px; right: -20px;
            width: 80px; height: 80px; border-radius: 50%;
            opacity: 0.07;
        }
        .stat-card.accent::after { background: var(--accent); }
        .stat-card.easy::after { background: var(--easy); }
        .stat-card.medium::after { background: var(--medium); }
        .stat-card.hard::after { background: var(--hard); }

        /* Badges */
        .badge {
            display: inline-flex; align-items: center; padding: 3px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge-easy { background: rgba(16,185,129,0.12); color: var(--easy); }
        .badge-medium { background: rgba(245,158,11,0.12); color: var(--medium); }
        .badge-hard { background: rgba(244,63,94,0.12); color: var(--hard); }
        .badge-quick { background: rgba(6,182,212,0.12); color: var(--quick); }
        .badge-regular { background: rgba(139,92,246,0.12); color: var(--regular); }
        .badge-topic { background: rgba(212,160,57,0.1); color: var(--accent); font-size: 11px; }
        .badge-sub { background: rgba(255,255,255,0.06); color: var(--muted); font-size: 11px; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
            border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
            border: none; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
        }
        .btn-primary { background: var(--accent); color: #0b0b0b; }
        .btn-primary:hover { background: #c4912e; transform: translateY(-1px); }
        .btn-secondary { background: rgba(255,255,255,0.06); color: var(--fg); border: 1px solid var(--border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: #444; }
        .btn-danger { background: rgba(244,63,94,0.12); color: var(--danger); }
        .btn-danger:hover { background: rgba(244,63,94,0.2); }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn-icon {
            width: 34px; height: 34px; padding: 0; display: inline-flex;
            align-items: center; justify-content: center; border-radius: 8px;
            background: transparent; border: 1px solid transparent; color: var(--muted);
            cursor: pointer; transition: all 0.2s;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.06); color: var(--fg); border-color: var(--border); }

        /* Form */
        .form-input {
            width: 100%; padding: 10px 14px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 8px; color: var(--fg);
            font-size: 14px; font-family: 'DM Sans', sans-serif; transition: border-color 0.2s;
            outline: none;
        }
        .form-input:focus { border-color: var(--accent); }
        .form-input::placeholder { color: #555; }
        textarea.form-input { resize: vertical; min-height: 80px; line-height: 1.6; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Level selector */
        .level-btn {
            flex: 1; padding: 10px; text-align: center; border-radius: 8px;
            border: 1px solid var(--border); background: transparent; color: var(--muted);
            cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
        }
        .level-btn:hover { border-color: #555; }
        .level-btn.sel-easy { border-color: var(--easy); background: rgba(16,185,129,0.1); color: var(--easy); }
        .level-btn.sel-medium { border-color: var(--medium); background: rgba(245,158,11,0.1); color: var(--medium); }
        .level-btn.sel-hard { border-color: var(--hard); background: rgba(244,63,94,0.1); color: var(--hard); }

        /* Revision selector */
        .rev-btn {
            flex: 1; padding: 10px; text-align: center; border-radius: 8px;
            border: 1px solid var(--border); background: transparent; color: var(--muted);
            cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s;
            font-family: 'DM Sans', sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .rev-btn:hover { border-color: #555; }
        .rev-btn.sel-quick { border-color: var(--quick); background: rgba(6,182,212,0.1); color: var(--quick); }
        .rev-btn.sel-regular { border-color: var(--regular); background: rgba(139,92,246,0.1); color: var(--regular); }

        /* Flip card */
        .flip-container { perspective: 1200px; width: 100%; }
        .flip-inner {
            transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
            transform-style: preserve-3d; position: relative;
        }
        .flip-inner.flipped { transform: rotateY(180deg); }
        .flip-front, .flip-back {
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            border-radius: 16px; min-height: 320px;
        }
        .flip-back { transform: rotateY(180deg); position: absolute; inset: 0; }

        /* Progress bar */
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

        /* Donut */
        .donut {
            width: 130px; height: 130px; border-radius: 50%; position: relative;
            mask: radial-gradient(circle at center, transparent 58%, black 59%);
            -webkit-mask: radial-gradient(circle at center, transparent 58%, black 59%);
        }
        .donut-center {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        /* Topic bar */
        .topic-bar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
        .topic-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 50; align-items: center; justify-content: center;
            backdrop-filter: blur(4px); padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 16px; width: 100%; max-width: 640px;
            max-height: 90vh; overflow-y: auto; animation: modalIn 0.25s ease;
        }
        @keyframes modalIn { from { opacity:0; transform: scale(0.95) translateY(10px); } to { opacity:1; transform: scale(1) translateY(0); } }

        /* Toast */
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
            display: flex; align-items: center; gap: 10px; min-width: 260px;
            border: 1px solid var(--border); background: var(--card);
        }
        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--danger); }
        .toast.info { border-left: 3px solid var(--accent); }
        @keyframes toastIn { from { opacity:0; transform: translateX(40px); } to { opacity:1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity:1; } to { opacity:0; transform: translateX(40px); } }

        /* Q item */
        .q-item { transition: all 0.2s; }
        .q-item:hover { background: var(--card-hover) !important; }
        .q-item .q-actions { opacity: 0; transition: opacity 0.2s; }
        .q-item:hover .q-actions { opacity: 1; }

        /* Filter chip */
        .chip {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer;
            border: 1px solid var(--border); color: var(--muted); transition: all 0.2s;
            background: transparent; font-family: 'DM Sans', sans-serif;
        }
        .chip:hover { border-color: #555; color: var(--fg); }
        .chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

        /* Checkbox custom */
        .chk-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
        .chk-wrap input[type="checkbox"] { display: none; }
        .chk-box {
            width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
            flex-shrink: 0; font-size: 11px; color: transparent;
        }
        .chk-wrap input:checked + .chk-box { border-color: var(--accent); background: var(--accent); color: #0b0b0b; }

        /* Empty state */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }

        /* Favorite star */
        .fav-star { color: #444; cursor: pointer; transition: color 0.2s; }
        .fav-star.active { color: var(--accent); }
        .fav-star:hover { color: var(--accent); }

        /* Pulse animation for practice */
        @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 0 0 rgba(212,160,57,0.2); } 50% { box-shadow: 0 0 20px 4px rgba(212,160,57,0.15); } }
        .pulse-glow { animation: pulse-glow 2s ease infinite; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            .main { margin-left: 0; padding: 20px 16px; }
            .q-item .q-actions { opacity: 1; }
        }

        /* Fade in */
        @keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
        .fade-up { animation: fadeUp 0.4s ease both; }
        .fade-up-d1 { animation-delay: 0.05s; }
        .fade-up-d2 { animation-delay: 0.1s; }
        .fade-up-d3 { animation-delay: 0.15s; }
        .fade-up-d4 { animation-delay: 0.2s; }

        /* Config panel */
        .config-section { padding: 20px 0; border-bottom: 1px solid var(--border); }
        .config-section:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div style="padding: 24px 20px 20px; border-bottom: 1px solid var(--border);">
            <div style="display:flex; align-items:center; gap:10px;">
                <i class="fa-solid fa-fire-flame-curved" style="color:var(--accent); font-size:22px;"></i>
                <h1 style="font-size:20px; font-weight:700; letter-spacing:-0.5px;">PrepForge</h1>
            </div>
            <p style="font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:0.3px;">INTERVIEW PREPARATION</p>
        </div>
        <nav style="flex:1; padding:12px 0; overflow-y:auto;">
            <div class="nav-item active" data-view="dashboard" onclick="navigate('dashboard')">
                <i class="fa-solid fa-grid-2"></i> Dashboard
            </div>
            <div class="nav-item" data-view="questions" onclick="navigate('questions')">
                <i class="fa-solid fa-list-check"></i> Questions
            </div>
            <div class="nav-item" data-view="practice" onclick="navigate('practice')">
                <i class="fa-solid fa-bolt"></i> Practice
            </div>
            <div class="nav-item" data-view="topics" onclick="navigate('topics')">
                <i class="fa-solid fa-folder-tree"></i> Topics
            </div>
        </nav>
        <div style="padding:16px 20px; border-top:1px solid var(--border); display:flex; gap:8px;">
            <button class="btn-icon" title="Export Data" onclick="exportData()"><i class="fa-solid fa-download"></i></button>
            <button class="btn-icon" title="Import Data" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-upload"></i></button>
            <button class="btn-icon" title="Clear All Data" onclick="clearAllData()" style="margin-left:auto;"><i class="fa-solid fa-trash" style="color:var(--danger);"></i></button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        </div>
    </aside>

    <!-- Mobile Header -->
    <div style="display:none; position:fixed; top:0; left:0; right:0; height:56px; background:var(--bg2); border-bottom:1px solid var(--border); z-index:30; padding:0 16px; align-items:center; justify-content:space-between;" id="mobileHeader">
        <button class="btn-icon" onclick="toggleSidebar(true)"><i class="fa-solid fa-bars"></i></button>
        <div style="display:flex; align-items:center; gap:8px;">
            <i class="fa-solid fa-fire-flame-curved" style="color:var(--accent);"></i>
            <span style="font-family:'Space Grotesk'; font-weight:700;">PrepForge</span>
        </div>
        <div style="width:34px;"></div>
    </div>

    <!-- Main Content -->
    <main class="main" id="mainContent"></main>

    <!-- Question Modal -->
    <div class="modal-overlay" id="questionModal">
        <div class="modal">
            <div style="padding:24px 28px 0;">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
                    <h2 style="font-size:20px; font-weight:700;" id="modalTitle">Add Question</h2>
                    <button class="btn-icon" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div>
                        <label class="form-label">Topic</label>
                        <input class="form-input" id="fTopic" list="dlTopics" placeholder="e.g., JavaScript">
                        <datalist id="dlTopics"></datalist>
                    </div>
                    <div>
                        <label class="form-label">Subtopic</label>
                        <input class="form-input" id="fSubtopic" list="dlSubtopics" placeholder="e.g., Closures">
                        <datalist id="dlSubtopics"></datalist>
                    </div>
                </div>
                <div style="margin-top:16px;">
                    <label class="form-label">Difficulty Level</label>
                    <div style="display:flex; gap:10px;" id="levelSelector">
                        <button class="level-btn" data-level="easy" onclick="selectLevel('easy')">Easy</button>
                        <button class="level-btn" data-level="medium" onclick="selectLevel('medium')">Medium</button>
                        <button class="level-btn" data-level="hard" onclick="selectLevel('hard')">Hard</button>
                    </div>
                </div>
                <div style="margin-top:16px;">
                    <label class="form-label">Revision Type</label>
                    <div style="display:flex; gap:10px;" id="revSelector">
                        <button class="rev-btn" data-rev="quick" onclick="selectRevision('quick')"><i class="fa-solid fa-bolt"></i> Quick</button>
                        <button class="rev-btn" data-rev="regular" onclick="selectRevision('regular')"><i class="fa-solid fa-book-open"></i> Regular</button>
                    </div>
                </div>
                <div style="margin-top:16px;">
                    <label class="form-label">Question</label>
                    <textarea class="form-input" id="fQuestion" rows="3" placeholder="Enter your question..."></textarea>
                </div>
                <div style="margin-top:16px;">
                    <label class="form-label">Answer</label>
                    <textarea class="form-input" id="fAnswer" rows="5" placeholder="Enter the answer or explanation..."></textarea>
                </div>
                <div style="margin-top:16px;">
                    <label class="form-label">Tags (comma separated)</label>
                    <input class="form-input" id="fTags" placeholder="e.g., arrays, sorting, dsa">
                </div>
                <div style="margin-top:16px; display:flex; align-items:center; gap:10px;">
                    <label class="chk-wrap">
                        <input type="checkbox" id="fFavorite">
                        <span class="chk-box"><i class="fa-solid fa-check"></i></span>
                        Mark as favorite
                    </label>
                </div>
            </div>
            <div style="padding:20px 28px 24px; display:flex; gap:10px; justify-content:flex-end; margin-top:8px;">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveQuestion()"><i class="fa-solid fa-check"></i> Save Question</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
    // ==================== STATE ====================
    let questions = [];
    let currentView = 'dashboard';
    let editingId = null;
    let selectedLevel = 'medium';
    let selectedRevision = 'regular';
    let filters = { search: '', topic: '', subtopic: '', level: '', revision: '', favorite: false };
    let practiceSession = null;
    let practiceTimer = null;
    let practiceSeconds = 0;
    let showAnswerMap = {};

    // ==================== SAMPLE DATA ====================
    function getSampleData() {
        return [
            { id: genId(), question: "What is the difference between == and === in JavaScript?", answer: "== performs type coercion before comparison, while === checks both value and type without coercion. For example, '5' == 5 is true, but '5' === 5 is false. Always prefer === for predictable comparisons.", topic: "JavaScript", subtopic: "Operators", level: "easy", revisionType: "quick", tags: ["js","basics"], favorite: true, createdAt: Date.now()-432000000, practiceCount: 3, lastPracticed: Date.now()-86400000, known: true },
            { id: genId(), question: "Explain closures in JavaScript with an example.", answer: "A closure is a function that retains access to its outer (lexical) scope even after the outer function has returned. Example:\nfunction counter() {\n  let count = 0;\n  return () => ++count;\n}\nconst inc = counter();\ninc(); // 1\ninc(); // 2\nThe inner function 'closes over' the count variable.", topic: "JavaScript", subtopic: "Closures", level: "medium", revisionType: "regular", tags: ["js","closures","scope"], favorite: false, createdAt: Date.now()-345600000, practiceCount: 5, lastPracticed: Date.now()-172800000, known: true },
            { id: genId(), question: "What is the event loop and how does it work?", answer: "The event loop is the mechanism that allows JavaScript to perform non-blocking operations despite being single-threaded. It continuously checks the call stack and task queue. When the call stack is empty, it picks the first task from the queue and pushes it onto the stack. Microtasks (Promises) have higher priority than macrotasks (setTimeout).", topic: "JavaScript", subtopic: "Async", level: "hard", revisionType: "regular", tags: ["js","async","event-loop"], favorite: true, createdAt: Date.now()-259200000, practiceCount: 2, lastPracticed: Date.now()-432000000, known: false },
            { id: genId(), question: "Explain the Virtual DOM in React.", answer: "The Virtual DOM is a lightweight JavaScript representation of the actual DOM. When state changes, React creates a new VDOM tree, compares it with the previous one using a diffing algorithm, and calculates the minimal set of changes needed. It then batches these changes and applies them to the real DOM in a single operation, improving performance.", topic: "React", subtopic: "Core Concepts", level: "medium", revisionType: "regular", tags: ["react","vdom","performance"], favorite: false, createdAt: Date.now()-172800000, practiceCount: 1, lastPracticed: Date.now()-259200000, known: false },
            { id: genId(), question: "What are React hooks? Name at least five.", answer: "Hooks are functions that let you use state and other React features in functional components. Key hooks:\n1. useState — state management\n2. useEffect — side effects\n3. useContext — context consumer\n4. useReducer — complex state logic\n5. useMemo — memoized values\n6. useCallback — memoized callbacks\n7. useRef — mutable ref\n8. useLayoutEffect — synchronous side effects", topic: "React", subtopic: "Hooks", level: "easy", revisionType: "quick", tags: ["react","hooks"], favorite: false, createdAt: Date.now()-86400000, practiceCount: 4, lastPracticed: Date.now()-43200000, known: true },
            { id: genId(), question: "Explain the difference between SQL and NoSQL databases.", answer: "SQL databases (MySQL, PostgreSQL) use structured tables with fixed schemas, support ACID transactions, and use SQL for queries. They're best for complex queries and relational data. NoSQL databases (MongoDB, Redis) are schema-flexible, handle unstructured data, scale horizontally easily, and use various data models (document, key-value, graph, column). Choose based on data structure, scale needs, and query complexity.", topic: "Databases", subtopic: "Concepts", level: "medium", revisionType: "regular", tags: ["sql","nosql","databases"], favorite: false, createdAt: Date.now()-43200000, practiceCount: 0, lastPracticed: null, known: false },
            { id: genId(), question: "What is the time complexity of binary search and why?", answer: "Binary search has O(log n) time complexity because it halves the search space with each comparison. Starting with n elements, after k comparisons we have n/2^k elements remaining. We find the element when n/2^k = 1, so k = log2(n). This requires the array to be sorted.", topic: "DSA", subtopic: "Searching", level: "easy", revisionType: "quick", tags: ["dsa","searching","complexity"], favorite: true, createdAt: Date.now()-21600000, practiceCount: 6, lastPracticed: Date.now()-7200000, known: true },
            { id: genId(), question: "Design a URL shortener like bit.ly.", answer: "Key components:\n1. Shortening Service: Takes long URL, generates short key (base62 encoding of auto-increment ID or hash), stores mapping\n2. Redirection Service: Looks up short key, returns 301/302 redirect\n3. Storage: Database for URL mappings (SQL for consistency, or NoSQL for scale)\n4. Caching: Redis for hot URLs to reduce DB load\n5. Analytics: Track clicks, referrers, timestamps\n6. Scalability: Horizontal scaling with consistent hashing, CDN for redirects\nTrade-offs: 301 vs 302 (301 caches at browser, 302 always hits server for analytics)", topic: "System Design", subtopic: "Web Systems", level: "hard", revisionType: "regular", tags: ["system-design","url-shortener","scalability"], favorite: true, createdAt: Date.now()-7200000, practiceCount: 1, lastPracticed: Date.now()-3600000, known: false },
            { id: genId(), question: "What is REST? What are its key principles?", answer: "REST (Representational State Transfer) is an architectural style for web services. Key principles:\n1. Statelessness — each request contains all info needed\n2. Uniform Interface — standard methods (GET, POST, PUT, DELETE), resource-based URLs\n3. Resource identification — resources identified by URIs\n4. Self-descriptive messages — use of standard MIME types\n5. Hypermedia as the engine of application state (HATEOAS)\n6. Layered system — intermediaries can exist between client and server\n7. Cacheability — responses must define themselves as cacheable or not", topic: "APIs", subtopic: "REST", level: "medium", revisionType: "regular", tags: ["api","rest","architecture"], favorite: false, createdAt: Date.now()-3600000, practiceCount: 0, lastPracticed: null, known: false },
            { id: genId(), question: "Explain the difference between process and thread.", answer: "A process is an independent executing program with its own memory space, file descriptors, and resources. A thread is the smallest unit of execution within a process — threads share the process's memory space and resources but have their own stack and register state.\nKey differences:\n- Processes are isolated; threads share memory\n- Context switching between processes is heavier than between threads\n- A crash in one process doesn't affect others; a thread crash can bring down the entire process\n- Processes require IPC for communication; threads can communicate directly via shared memory", topic: "OS", subtopic: "Processes", level: "medium", revisionType: "quick", tags: ["os","processes","threads","concurrency"], favorite: false, createdAt: Date.now(), practiceCount: 0, lastPracticed: null, known: false },
        ];
    }

    // ==================== STORAGE ====================
    function save() { localStorage.setItem('prepforge_q', JSON.stringify(questions)); }
    function load() {
        const d = localStorage.getItem('prepforge_q');
        if (d) {
            try {
                questions = JSON.parse(d);
                // Ensure revisionType exists on all questions (backward compat)
                questions.forEach(q => { if (!q.revisionType) q.revisionType = 'regular'; });
            } catch(e) { questions = getSampleData(); save(); }
        }
        else { questions = getSampleData(); save(); }
    }

    // ==================== UTILITIES ====================
    function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function timeAgo(ts) {
        if (!ts) return 'Never';
        const d = Date.now() - ts, m = Math.floor(d/60000), h = Math.floor(d/3600000), dy = Math.floor(d/86400000);
        if (m < 1) return 'Just now'; if (m < 60) return m + 'm ago'; if (h < 24) return h + 'h ago'; return dy + 'd ago';
    }
    function getTopics() {
        const t = {};
        questions.forEach(q => { if (!t[q.topic]) t[q.topic] = {}; if (!t[q.topic][q.subtopic]) t[q.topic][q.subtopic] = 0; t[q.topic][q.subtopic]++; });
        return t;
    }
    function getAllSubtopics(topic) {
        const s = new Set();
        questions.forEach(q => { if (!topic || q.topic === topic) s.add(q.subtopic); });
        return [...s];
    }
    function getFiltered() {
        return questions.filter(q => {
            if (filters.search) { const s = filters.search.toLowerCase(); if (!(q.question.toLowerCase().includes(s) || q.answer.toLowerCase().includes(s) || q.topic.toLowerCase().includes(s) || q.subtopic.toLowerCase().includes(s) || q.tags.some(t => t.toLowerCase().includes(s)))) return false; }
            if (filters.topic && q.topic !== filters.topic) return false;
            if (filters.subtopic && q.subtopic !== filters.subtopic) return false;
            if (filters.level && q.level !== filters.level) return false;
            if (filters.revision && q.revisionType !== filters.revision) return false;
            if (filters.favorite && !q.favorite) return false;
            return true;
        });
    }
    const topicColors = ['#d4a039','#10b981','#f43f5e','#8b5cf6','#06b6d4','#ec4899','#f97316','#84cc16','#6366f1','#14b8a6'];

    // ==================== TOAST ====================
    function toast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
        const colors = { success: 'var(--success)', error: 'var(--danger)', info: 'var(--accent)' };
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.innerHTML = `<i class="fa-solid ${icons[type]}" style="color:${colors[type]}"></i> ${esc(msg)}`;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // ==================== NAVIGATION ====================
    function navigate(view) {
        currentView = view;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
        toggleSidebar(false);
        render();
    }
    function toggleSidebar(open) {
        document.getElementById('sidebar').classList.toggle('open', open);
        document.getElementById('sidebarOverlay').classList.toggle('open', open);
    }

    // ==================== RENDER ====================
    function render() {
        const m = document.getElementById('mainContent');
        switch(currentView) {
            case 'dashboard': m.innerHTML = renderDashboard(); break;
            case 'questions': m.innerHTML = renderQuestions(); break;
            case 'practice': m.innerHTML = renderPractice(); break;
            case 'topics': m.innerHTML = renderTopics(); break;
        }
        attachListeners();
    }

    // ==================== DASHBOARD ====================
    function renderDashboard() {
        const total = questions.length;
        const easy = questions.filter(q => q.level === 'easy').length;
        const med = questions.filter(q => q.level === 'medium').length;
        const hard = questions.filter(q => q.level === 'hard').length;
        const quick = questions.filter(q => q.revisionType === 'quick').length;
        const regular = questions.filter(q => q.revisionType === 'regular').length;
        const practiced = questions.filter(q => q.practiceCount > 0).length;
        const known = questions.filter(q => q.known).length;
        const topics = getTopics();
        const topicNames = Object.keys(topics);
        const maxQ = Math.max(...topicNames.map(t => Object.values(topics[t]).reduce((a,b)=>a+b,0)), 1);

        // Donut chart
        let easyP=0, medP=0, hardP=0;
        if (total > 0) { easyP = (easy/total*100); medP = (med/total*100); hardP = (hard/total*100); }
        const donutBg = total > 0 ? `conic-gradient(var(--easy) 0% ${easyP}%, var(--medium) ${easyP}% ${easyP+medP}%, var(--hard) ${easyP+medP}% 100%)` : 'var(--border)';

        // Revision donut
        let quickP=0, regularP=0;
        if (total > 0) { quickP = (quick/total*100); regularP = (regular/total*100); }
        const revDonutBg = total > 0 ? `conic-gradient(var(--quick) 0% ${quickP}%, var(--regular) ${quickP}% 100%)` : 'var(--border)';

        // Recent
        const recent = [...questions].sort((a,b) => b.createdAt - a.createdAt).slice(0, 5);

        return `
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:28px;" class="fade-up">
            <div>
                <h2 style="font-size:28px; font-weight:700; letter-spacing:-0.5px;">Dashboard</h2>
                <p style="color:var(--muted); font-size:14px; margin-top:4px;">Overview of your preparation</p>
            </div>
            <button class="btn btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add Question</button>
        </div>

        <!-- Stats -->
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:28px;">
            <div class="stat-card accent fade-up fade-up-d1">
                <p style="font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Total Questions</p>
                <p style="font-size:36px; font-weight:700; margin-top:4px; font-family:'Space Grotesk';">${total}</p>
                <p style="font-size:12px; color:var(--muted); margin-top:4px;">${topicNames.length} topics</p>
            </div>
            <div class="stat-card easy fade-up fade-up-d2">
                <p style="font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Easy</p>
                <p style="font-size:36px; font-weight:700; margin-top:4px; font-family:'Space Grotesk'; color:var(--easy);">${easy}</p>
                <p style="font-size:12px; color:var(--muted); margin-top:4px;">${total?Math.round(easy/total*100):0}% of total</p>
            </div>
            <div class="stat-card medium fade-up fade-up-d3">
                <p style="font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Medium</p>
                <p style="font-size:36px; font-weight:700; margin-top:4px; font-family:'Space Grotesk'; color:var(--medium);">${med}</p>
                <p style="font-size:12px; color:var(--muted); margin-top:4px;">${total?Math.round(med/total*100):0}% of total</p>
            </div>
            <div class="stat-card hard fade-up fade-up-d4">
                <p style="font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Hard</p>
                <p style="font-size:36px; font-weight:700; margin-top:4px; font-family:'Space Grotesk'; color:var(--hard);">${hard}</p>
                <p style="font-size:12px; color:var(--muted); margin-top:4px;">${total?Math.round(hard/total*100):0}% of total</p>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:20px; margin-bottom:28px;">
            <!-- Level Distribution -->
            <div class="card fade-up" style="animation-delay:0.2s;">
                <h3 style="font-size:16px; font-weight:600; margin-bottom:20px;">Level Distribution</h3>
                <div style="display:flex; align-items:center; gap:24px;">
                    <div class="donut" style="background:${donutBg}; flex-shrink:0;">
                        <div class="donut-center">
                            <span style="font-size:24px; font-weight:700; font-family:'Space Grotesk';">${total}</span>
                            <span style="font-size:10px; color:var(--muted);">total</span>
                        </div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:12px; flex:1;">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="width:10px;height:10px;border-radius:3px;background:var(--easy);flex-shrink:0;"></div>
                            <span style="font-size:13px; flex:1;">Easy</span>
                            <span style="font-size:13px; font-weight:600;">${easy}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="width:10px;height:10px;border-radius:3px;background:var(--medium);flex-shrink:0;"></div>
                            <span style="font-size:13px; flex:1;">Medium</span>
                            <span style="font-size:13px; font-weight:600;">${med}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="width:10px;height:10px;border-radius:3px;background:var(--hard);flex-shrink:0;"></div>
                            <span style="font-size:13px; flex:1;">Hard</span>
                            <span style="font-size:13px; font-weight:600;">${hard}</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Revision Distribution -->
            <div class="card fade-up" style="animation-delay:0.22s;">
                <h3 style="font-size:16px; font-weight:600; margin-bottom:20px;">Revision Type</h3>
                <div style="display:flex; align-items:center; gap:24px;">
                    <div class="donut" style="background:${revDonutBg}; flex-shrink:0;">
                        <div class="donut-center">
                            <span style="font-size:24px; font-weight:700; font-family:'Space Grotesk';">${total}</span>
                            <span style="font-size:10px; color:var(--muted);">total</span>
                        </div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:12px; flex:1;">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="width:10px;height:10px;border-radius:3px;background:var(--quick);flex-shrink:0;"></div>
                            <span style="font-size:13px; flex:1;"><i class="fa-solid fa-bolt" style="font-size:10px;"></i> Quick</span>
                            <span style="font-size:13px; font-weight:600;">${quick}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="width:10px;height:10px;border-radius:3px;background:var(--regular);flex-shrink:0;"></div>
                            <span style="font-size:13px; flex:1;"><i class="fa-solid fa-book-open" style="font-size:10px;"></i> Regular</span>
                            <span style="font-size:13px; font-weight:600;">${regular}</span>
                        </div>
                        <div style="margin-top:4px; font-size:11px; color:var(--muted);">
                            ${total?Math.round(quick/total*100):0}% quick · ${total?Math.round(regular/total*100):0}% regular
                        </div>
                    </div>
                </div>
            </div>

            <!-- Practice Stats -->
            <div class="card fade-up" style="animation-delay:0.25s;">
                <h3 style="font-size:16px; font-weight:600; margin-bottom:20px;">Practice Stats</h3>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div style="text-align:center; padding:14px; background:var(--bg); border-radius:10px;">
                        <p style="font-size:22px; font-weight:700; font-family:'Space Grotesk'; color:var(--accent);">${practiced}</p>
                        <p style="font-size:11px; color:var(--muted); margin-top:4px;">Practiced</p>
                    </div>
                    <div style="text-align:center; padding:14px; background:var(--bg); border-radius:10px;">
                        <p style="font-size:22px; font-weight:700; font-family:'Space Grotesk'; color:var(--success);">${known}</p>
                        <p style="font-size:11px; color:var(--muted); margin-top:4px;">Mastered</p>
                    </div>
                    <div style="text-align:center; padding:14px; background:var(--bg); border-radius:10px;">
                        <p style="font-size:22px; font-weight:700; font-family:'Space Grotesk';">${total - practiced}</p>
                        <p style="font-size:11px; color:var(--muted); margin-top:4px;">Unpracticed</p>
                    </div>
                    <div style="text-align:center; padding:14px; background:var(--bg); border-radius:10px;">
                        <p style="font-size:22px; font-weight:700; font-family:'Space Grotesk';">${total?Math.round(known/total*100):0}%</p>
                        <p style="font-size:11px; color:var(--muted); margin-top:4px;">Mastery Rate</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Topics + Recent -->
        <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:20px;">
            <div class="card fade-up" style="animation-delay:0.3s;">
                <h3 style="font-size:16px; font-weight:600; margin-bottom:20px;">Topics Breakdown</h3>
                ${topicNames.length === 0 ? '<p style="color:var(--muted); font-size:14px;">No topics yet. Add some questions!</p>' :
                topicNames.map((t, i) => {
                    const cnt = Object.values(topics[t]).reduce((a,b)=>a+b,0);
                    const pct = Math.round(cnt/maxQ*100);
                    return `<div style="margin-bottom:16px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                            <span style="font-size:13px; font-weight:500;">${esc(t)}</span>
                            <span style="font-size:12px; color:var(--muted);">${cnt} Q</span>
                        </div>
                        <div class="topic-bar"><div class="topic-bar-fill" style="width:${pct}%; background:${topicColors[i%topicColors.length]};"></div></div>
                    </div>`;
                }).join('')}
            </div>
            <div class="card fade-up" style="animation-delay:0.35s;">
                <h3 style="font-size:16px; font-weight:600; margin-bottom:20px;">Recently Added</h3>
                ${recent.length === 0 ? '<p style="color:var(--muted); font-size:14px;">No questions yet.</p>' :
                recent.map(q => `
                    <div style="padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer;" onclick="navigateToQuestion('${q.id}')">
                        <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-wrap:wrap;">
                            <span class="badge badge-${q.level}">${q.level}</span>
                            <span class="badge badge-${q.revisionType||'regular'}"><i class="fa-solid ${q.revisionType==='quick'?'fa-bolt':'fa-book-open'}" style="font-size:9px;"></i> ${q.revisionType||'regular'}</span>
                            <span class="badge badge-topic">${esc(q.topic)}</span>
                        </div>
                        <p style="font-size:13px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${esc(q.question)}</p>
                        <p style="font-size:11px; color:var(--muted); margin-top:4px;">${timeAgo(q.createdAt)}</p>
                    </div>
                `).join('')}
            </div>
        </div>`;
    }

    function navigateToQuestion(id) {
        filters = { search: '', topic: '', subtopic: '', level: '', revision: '', favorite: false };
        navigate('questions');
        setTimeout(() => {
            const el = document.querySelector(`[data-qid="${id}"]`);
            if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.boxShadow = '0 0 0 2px var(--accent)'; setTimeout(() => el.style.boxShadow = '', 2000); }
        }, 100);
    }

    // ==================== QUESTIONS ====================
    function renderQuestions() {
        const topics = getTopics();
        const topicNames = Object.keys(topics).sort();
        const subtopics = filters.topic ? getAllSubtopics(filters.topic).sort() : getAllSubtopics().sort();
        const filtered = getFiltered();

        return `
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px;" class="fade-up">
            <div>
                <h2 style="font-size:28px; font-weight:700; letter-spacing:-0.5px;">Questions</h2>
                <p style="color:var(--muted); font-size:14px; margin-top:4px;">${filtered.length} of ${questions.length} questions</p>
            </div>
            <button class="btn btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add Question</button>
        </div>

        <!-- Filters -->
        <div class="card fade-up fade-up-d1" style="margin-bottom:20px; padding:16px 20px;">
            <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center;">
                <div style="flex:1; min-width:220px; position:relative;">
                    <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px;"></i>
                    <input class="form-input" id="searchInput" placeholder="Search questions, answers, topics..." style="padding-left:36px;" value="${esc(filters.search)}">
                </div>
                <select class="form-input" id="filterTopic" style="width:auto; min-width:150px;">
                    <option value="">All Topics</option>
                    ${topicNames.map(t => `<option value="${esc(t)}" ${filters.topic===t?'selected':''}>${esc(t)}</option>`).join('')}
                </select>
                <select class="form-input" id="filterSubtopic" style="width:auto; min-width:150px;">
                    <option value="">All Subtopics</option>
                    ${subtopics.map(s => `<option value="${esc(s)}" ${filters.subtopic===s?'selected':''}>${esc(s)}</option>`).join('')}
                </select>
                <select class="form-input" id="filterLevel" style="width:auto; min-width:120px;">
                    <option value="">All Levels</option>
                    <option value="easy" ${filters.level==='easy'?'selected':''}>Easy</option>
                    <option value="medium" ${filters.level==='medium'?'selected':''}>Medium</option>
                    <option value="hard" ${filters.level==='hard'?'selected':''}>Hard</option>
                </select>
                <select class="form-input" id="filterRevision" style="width:auto; min-width:140px;">
                    <option value="">All Revisions</option>
                    <option value="quick" ${filters.revision==='quick'?'selected':''}>Quick</option>
                    <option value="regular" ${filters.revision==='regular'?'selected':''}>Regular</option>
                </select>
                <label class="chip ${filters.favorite?'active':''}" id="filterFav" style="flex-shrink:0;">
                    <i class="fa-solid fa-star" style="font-size:11px;"></i> Favorites
                </label>
            </div>
        </div>

        <!-- Question List -->
        <div class="fade-up fade-up-d2">
            ${filtered.length === 0 ? `
                <div class="empty-state">
                    <i class="fa-solid fa-inbox"></i>
                    <p style="font-size:16px; font-weight:500; margin-bottom:8px;">${questions.length === 0 ? 'No questions yet' : 'No matches found'}</p>
                    <p style="font-size:13px;">${questions.length === 0 ? 'Add your first question to get started.' : 'Try adjusting your filters.'}</p>
                </div>
            ` : filtered.map(q => `
                <div class="card q-item" data-qid="${q.id}" style="margin-bottom:10px; padding:16px 20px; cursor:default;">
                    <div style="display:flex; align-items:flex-start; gap:14px;">
                        <div style="flex:1; min-width:0;">
                            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
                                <span class="badge badge-${q.level}">${q.level}</span>
                                <span class="badge badge-${q.revisionType||'regular'}"><i class="fa-solid ${q.revisionType==='quick'?'fa-bolt':'fa-book-open'}" style="font-size:9px;"></i> ${q.revisionType||'regular'}</span>
                                <span class="badge badge-topic">${esc(q.topic)}</span>
                                <span class="badge badge-sub">${esc(q.subtopic)}</span>
                                ${q.tags.slice(0,3).map(t => `<span style="font-size:11px; color:var(--muted);">#${esc(t)}</span>`).join(' ')}
                                ${q.known ? '<span style="font-size:11px; color:var(--success);"><i class="fa-solid fa-circle-check"></i> Mastered</span>' : ''}
                            </div>
                            <p style="font-size:14px; line-height:1.6; margin-bottom:8px;">${esc(q.question)}</p>
                            <div id="ans-${q.id}" style="display:${showAnswerMap[q.id]?'block':'none'};">
                                <div style="background:var(--bg); border-radius:8px; padding:14px 16px; margin-bottom:8px; border-left:3px solid var(--accent);">
                                    <p style="font-size:13px; line-height:1.7; color:#ccc; white-space:pre-wrap;">${esc(q.answer)}</p>
                                </div>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                                <button class="btn btn-secondary btn-sm" onclick="toggleAnswer('${q.id}')">
                                    <i class="fa-solid fa-eye"></i> ${showAnswerMap[q.id]?'Hide':'Show'} Answer
                                </button>
                                <span style="font-size:11px; color:var(--muted);">Practiced ${q.practiceCount||0}x &middot; ${timeAgo(q.lastPracticed)}</span>
                            </div>
                        </div>
                        <div class="q-actions" style="display:flex; flex-direction:column; gap:4px; flex-shrink:0;">
                            <button class="btn-icon" title="Favorite" onclick="toggleFavorite('${q.id}')">
                                <i class="fa-${q.favorite?'solid':'regular'} fa-star fav-star ${q.favorite?'active':''}"></i>
                            </button>
                            <button class="btn-icon" title="Edit" onclick="openModal('${q.id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-icon" title="Delete" onclick="deleteQuestion('${q.id}')"><i class="fa-solid fa-trash" style="color:var(--danger);"></i></button>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>`;
    }

    function toggleAnswer(id) { showAnswerMap[id] = !showAnswerMap[id]; render(); }
    function toggleFavorite(id) {
        const q = questions.find(q => q.id === id);
        if (q) { q.favorite = !q.favorite; save(); render(); toast(q.favorite ? 'Added to favorites' : 'Removed from favorites', 'info'); }
    }
    function deleteQuestion(id) {
        const q = questions.find(q => q.id === id);
        if (!q) return;
        // Custom inline confirm
        const el = document.querySelector(`[data-qid="${id}"]`);
        if (el && !el.dataset.confirming) {
            el.dataset.confirming = 'true';
            el.style.borderColor = 'var(--danger)';
            el.insertAdjacentHTML('beforeend', `
                <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px;">
                    <span style="font-size:13px; color:var(--danger);">Delete this question?</span>
                    <button class="btn btn-danger btn-sm" onclick="confirmDelete('${id}')">Yes, Delete</button>
                    <button class="btn btn-secondary btn-sm" onclick="cancelDelete('${id}')">Cancel</button>
                </div>
            `);
        }
    }
    function confirmDelete(id) {
        questions = questions.filter(q => q.id !== id);
        save(); render(); toast('Question deleted', 'success');
    }
    function cancelDelete(id) {
        const el = document.querySelector(`[data-qid="${id}"]`);
        if (el) { delete el.dataset.confirming; el.style.borderColor = ''; render(); }
    }

    // ==================== PRACTICE ====================
    function renderPractice() {
        if (practiceSession && practiceSession.active) return renderPracticeSession();
        if (practiceSession && practiceSession.finished) return renderPracticeResults();
        return renderPracticeConfig();
    }

    function renderPracticeConfig() {
        const topics = getTopics();
        const topicNames = Object.keys(topics).sort();

        return `
        <div style="max-width:700px; margin:0 auto;" class="fade-up">
            <div style="text-align:center; margin-bottom:36px;">
                <h2 style="font-size:28px; font-weight:700; letter-spacing:-0.5px;">Practice Session</h2>
                <p style="color:var(--muted); font-size:14px; margin-top:6px;">Configure and generate a custom quiz</p>
            </div>

            <div class="card" style="padding:28px;">
                <!-- Topics -->
                <div class="config-section" style="padding-top:0;">
                    <h3 style="font-size:14px; font-weight:600; margin-bottom:14px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);">Topics</h3>
                    <div style="display:flex; flex-wrap:wrap; gap:8px;" id="cfgTopics">
                        <label class="chip active" data-topic=""><i class="fa-solid fa-layer-group" style="font-size:10px;"></i> All Topics</label>
                        ${topicNames.map((t,i) => {
                            const cnt = Object.values(topics[t]).reduce((a,b)=>a+b,0);
                            return `<label class="chip" data-topic="${esc(t)}"><span style="width:8px;height:8px;border-radius:2px;background:${topicColors[i%topicColors.length]};display:inline-block;"></span> ${esc(t)} <span style="color:var(--muted); font-size:11px;">(${cnt})</span></label>`;
                        }).join('')}
                    </div>
                </div>

                <!-- Subtopics -->
                <div class="config-section" id="cfgSubtopicsWrap" style="display:none;">
                    <h3 style="font-size:14px; font-weight:600; margin-bottom:14px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);">Subtopics</h3>
                    <div style="display:flex; flex-wrap:wrap; gap:8px;" id="cfgSubtopics"></div>
                </div>

                <!-- Levels -->
                <div class="config-section">
                    <h3 style="font-size:14px; font-weight:600; margin-bottom:14px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);">Difficulty Levels</h3>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;" id="cfgLevels">
                        <label class="chip active" data-level=""><i class="fa-solid fa-layer-group" style="font-size:10px;"></i> All Levels</label>
                        <label class="chip" data-level="easy"><span style="color:var(--easy);">&#9679;</span> Easy</label>
                        <label class="chip" data-level="medium"><span style="color:var(--medium);">&#9679;</span> Medium</label>
                        <label class="chip" data-level="hard"><span style="color:var(--hard);">&#9679;</span> Hard</label>
                    </div>
                </div>

                <!-- Revision Type -->
                <div class="config-section">
                    <h3 style="font-size:14px; font-weight:600; margin-bottom:14px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);">Revision Type</h3>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;" id="cfgRevisions">
                        <label class="chip active" data-revision=""><i class="fa-solid fa-layer-group" style="font-size:10px;"></i> All Revisions</label>
                        <label class="chip" data-revision="quick"><i class="fa-solid fa-bolt" style="font-size:10px; color:var(--quick);"></i> Quick</label>
                        <label class="chip" data-revision="regular"><i class="fa-solid fa-book-open" style="font-size:10px; color:var(--regular);"></i> Regular</label>
                    </div>
                </div>

                <!-- Count & Options -->
                <div class="config-section">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                        <div>
                            <label class="form-label">Number of Questions</label>
                            <input type="number" class="form-input" id="cfgCount" value="5" min="1" max="${questions.length||1}">
                        </div>
                        <div>
                            <label class="form-label">Order</label>
                            <select class="form-input" id="cfgOrder">
                                <option value="random">Random</option>
                                <option value="sequential">Sequential</option>
                            </select>
                        </div>
                    </div>
                    <div style="margin-top:16px; display:flex; flex-direction:column; gap:10px;">
                        <label class="chk-wrap">
                            <input type="checkbox" id="cfgPrioritize">
                            <span class="chk-box"><i class="fa-solid fa-check"></i></span>
                            Prioritize unpracticed questions
                        </label>
                        <label class="chk-wrap">
                            <input type="checkbox" id="cfgOnlyNew">
                            <span class="chk-box"><i class="fa-solid fa-check"></i></span>
                            Only unpracticed questions
                        </label>
                        <label class="chk-wrap">
                            <input type="checkbox" id="cfgFavorites">
                            <span class="chk-box"><i class="fa-solid fa-check"></i></span>
                            Only favorites
                        </label>
                    </div>
                </div>

                <button class="btn btn-primary" style="width:100%; justify-content:center; padding:14px; font-size:15px; margin-top:8px;" onclick="generateSession()">
                    <i class="fa-solid fa-bolt"></i> Generate Session
                </button>
            </div>
        </div>`;
    }

    function renderPracticeSession() {
        const s = practiceSession;
        const q = s.questions[s.currentIndex];
        const pct = ((s.currentIndex) / s.questions.length * 100);
        const mins = Math.floor(practiceSeconds / 60).toString().padStart(2, '0');
        const secs = (practiceSeconds % 60).toString().padStart(2, '0');

        return `
        <div style="max-width:720px; margin:0 auto;" class="fade-up">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
                <button class="btn btn-secondary btn-sm" onclick="endPractice()"><i class="fa-solid fa-xmark"></i> End Session</button>
                <div style="display:flex; align-items:center; gap:16px;">
                    <span style="font-size:14px; color:var(--muted);"><i class="fa-regular fa-clock"></i> ${mins}:${secs}</span>
                    <span style="font-size:14px; font-weight:600;">${s.currentIndex + 1} / ${s.questions.length}</span>
                </div>
            </div>
            <div class="progress-bar" style="margin-bottom:28px;"><div class="progress-fill" style="width:${pct}%; background:var(--accent);"></div></div>

            <!-- Flip Card -->
            <div class="flip-container" onclick="flipCard()" style="cursor:pointer;">
                <div class="flip-inner ${s.flipped?'flipped':''}" id="flipInner">
                    <div class="flip-front card pulse-glow" style="padding:36px 32px; display:flex; flex-direction:column; justify-content:center; min-height:340px; border:1px solid var(--accent); border-color: rgba(212,160,57,0.3);">
                        <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px; flex-wrap:wrap;">
                            <span class="badge badge-${q.level}">${q.level}</span>
                            <span class="badge badge-${q.revisionType||'regular'}"><i class="fa-solid ${q.revisionType==='quick'?'fa-bolt':'fa-book-open'}" style="font-size:9px;"></i> ${q.revisionType||'regular'}</span>
                            <span class="badge badge-topic">${esc(q.topic)}</span>
                            <span class="badge badge-sub">${esc(q.subtopic)}</span>
                        </div>
                        <p style="font-size:18px; line-height:1.7; font-weight:500;">${esc(q.question)}</p>
                        <p style="font-size:12px; color:var(--muted); margin-top:24px; text-align:center;">Click to reveal answer</p>
                    </div>
                    <div class="flip-back card" style="padding:36px 32px; display:flex; flex-direction:column; justify-content:center; min-height:340px; overflow-y:auto; border:1px solid rgba(16,185,129,0.3);">
                        <p style="font-size:12px; color:var(--success); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:16px;">Answer</p>
                        <p style="font-size:15px; line-height:1.8; color:#ccc; white-space:pre-wrap;">${esc(q.answer)}</p>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div style="display:flex; gap:12px; margin-top:24px; justify-content:center;" id="practiceActions" style="${s.flipped?'':'opacity:0.3;pointer-events:none;'}">
                <button class="btn" style="flex:1; justify-content:center; padding:14px; background:rgba(244,63,94,0.1); color:var(--danger); border:1px solid rgba(244,63,94,0.3); max-width:220px; ${s.flipped?'':'opacity:0.3;pointer-events:none;'}" onclick="markResult(false)">
                    <i class="fa-solid fa-rotate-right"></i> Need Practice
                </button>
                <button class="btn" style="flex:1; justify-content:center; padding:14px; background:rgba(16,185,129,0.1); color:var(--success); border:1px solid rgba(16,185,129,0.3); max-width:220px; ${s.flipped?'':'opacity:0.3;pointer-events:none;'}" onclick="markResult(true)">
                    <i class="fa-solid fa-check"></i> Got It
                </button>
            </div>
        </div>`;
    }

    function renderPracticeResults() {
        const s = practiceSession;
        const correct = s.results.filter(r => r.known).length;
        const total = s.results.length;
        const pct = Math.round(correct / total * 100);
        const mins = Math.floor(practiceSeconds / 60).toString().padStart(2, '0');
        const secs = (practiceSeconds % 60).toString().padStart(2, '0');
        const wrong = s.results.filter(r => !r.known);

        return `
        <div style="max-width:700px; margin:0 auto;" class="fade-up">
            <div style="text-align:center; margin-bottom:36px;">
                <h2 style="font-size:28px; font-weight:700; letter-spacing:-0.5px;">Session Complete</h2>
                <p style="color:var(--muted); font-size:14px; margin-top:6px;">Here's how you performed</p>
            </div>

            <div class="card" style="text-align:center; padding:40px 28px; margin-bottom:20px;">
                <div class="donut" style="width:160px; height:160px; margin:0 auto 20px; background:conic-gradient(var(--success) 0% ${pct}%, var(--border) ${pct}% 100%); mask:radial-gradient(circle at center, transparent 62%, black 63%); -webkit-mask:radial-gradient(circle at center, transparent 62%, black 63%);">
                    <div class="donut-center">
                        <span style="font-size:36px; font-weight:700; font-family:'Space Grotesk';">${pct}%</span>
                    </div>
                </div>
                <p style="font-size:20px; font-weight:600; margin-bottom:4px;">${correct} out of ${total} correct</p>
                <p style="font-size:14px; color:var(--muted);">Time: ${mins}:${secs}</p>
            </div>

            <!-- Level breakdown -->
            <div class="card" style="padding:20px; margin-bottom:20px;">
                <h3 style="font-size:14px; font-weight:600; margin-bottom:16px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);">By Difficulty</h3>
                ${['easy','medium','hard'].map(lvl => {
                    const lvlResults = s.results.filter(r => r.question.level === lvl);
                    if (lvlResults.length === 0) return '';
                    const lvlCorrect = lvlResults.filter(r => r.known).length;
                    const lvlPct = Math.round(lvlCorrect/lvlResults.length*100);
                    return `<div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
                        <span class="badge badge-${lvl}" style="width:70px; justify-content:center;">${lvl}</span>
                        <div class="progress-bar" style="flex:1;"><div class="progress-fill" style="width:${lvlPct}%; background:var(--${lvl});"></div></div>
                        <span style="font-size:13px; font-weight:600; width:60px; text-align:right;">${lvlCorrect}/${lvlResults.length}</span>
                    </div>`;
                }).join('')}

                <h3 style="font-size:14px; font-weight:600; margin:20px 0 12px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);">By Revision Type</h3>
                ${['quick','regular'].map(rev => {
                    const revResults = s.results.filter(r => (r.question.revisionType||'regular') === rev);
                    if (revResults.length === 0) return '';
                    const revCorrect = revResults.filter(r => r.known).length;
                    const revPct = Math.round(revCorrect/revResults.length*100);
                    return `<div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
                        <span class="badge badge-${rev}" style="width:80px; justify-content:center;"><i class="fa-solid ${rev==='quick'?'fa-bolt':'fa-book-open'}" style="font-size:9px;"></i> ${rev}</span>
                        <div class="progress-bar" style="flex:1;"><div class="progress-fill" style="width:${revPct}%; background:var(--${rev});"></div></div>
                        <span style="font-size:13px; font-weight:600; width:60px; text-align:right;">${revCorrect}/${revResults.length}</span>
                    </div>`;
                }).join('')}
            </div>

            ${wrong.length > 0 ? `
            <div class="card" style="padding:20px; margin-bottom:20px;">
                <h3 style="font-size:14px; font-weight:600; margin-bottom:16px; text-transform:uppercase; letter-spacing:0.5px; color:var(--danger);">Needs Review (${wrong.length})</h3>
                ${wrong.map(r => `
                    <div style="padding:12px 0; border-bottom:1px solid var(--border);">
                        <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;">
                            <span class="badge badge-${r.question.level}">${r.question.level}</span>
                            <span class="badge badge-${r.question.revisionType||'regular'}"><i class="fa-solid ${r.question.revisionType==='quick'?'fa-bolt':'fa-book-open'}" style="font-size:9px;"></i> ${r.question.revisionType||'regular'}</span>
                            <span class="badge badge-topic">${esc(r.question.topic)}</span>
                        </div>
                        <p style="font-size:13px; margin-bottom:6px;">${esc(r.question.question)}</p>
                        <p style="font-size:12px; color:#aaa; line-height:1.6; white-space:pre-wrap; display:none;" id="rev-${r.question.id}">${esc(r.question.answer)}</p>
                        <button class="btn btn-secondary btn-sm" style="margin-top:4px;" onclick="document.getElementById('rev-${r.question.id}').style.display=document.getElementById('rev-${r.question.id}').style.display==='block'?'none':'block'; this.innerHTML=this.innerHTML.includes('Show')?'Hide Answer':'Show Answer';">
                            <i class="fa-solid fa-eye"></i> Show Answer
                        </button>
                    </div>
                `).join('')}
            </div>` : ''}

            <div style="display:flex; gap:12px; justify-content:center;">
                ${wrong.length > 0 ? `<button class="btn btn-secondary" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> Retry Wrong Answers</button>` : ''}
                <button class="btn btn-primary" onclick="newSession()"><i class="fa-solid fa-bolt"></i> New Session</button>
                <button class="btn btn-secondary" onclick="navigate('dashboard')"><i class="fa-solid fa-grid-2"></i> Dashboard</button>
            </div>
        </div>`;
    }

    function flipCard() {
        if (!practiceSession) return;
        practiceSession.flipped = !practiceSession.flipped;
        render();
    }

    function markResult(known) {
        if (!practiceSession || !practiceSession.flipped) return;
        const s = practiceSession;
        const q = s.questions[s.currentIndex];
        s.results.push({ question: q, known: known });

        // Update question stats
        const orig = questions.find(oq => oq.id === q.id);
        if (orig) {
            orig.practiceCount = (orig.practiceCount || 0) + 1;
            orig.lastPracticed = Date.now();
            orig.known = known;
            save();
        }

        s.currentIndex++;
        s.flipped = false;

        if (s.currentIndex >= s.questions.length) {
            // Session complete
            s.active = false;
            s.finished = true;
            clearInterval(practiceTimer);
            render();
        } else {
            render();
        }
    }

    function generateSession() {
        let pool = [...questions];
        const selectedTopics = getSelectedChips('cfgTopics');
        const selectedLevels = getSelectedChips('cfgLevels');
        const selectedRevisions = getSelectedChips('cfgRevisions');
        const selectedSubtopics = document.getElementById('cfgSubtopicsWrap').style.display !== 'none' ? getSelectedChips('cfgSubtopics') : [];
        const count = parseInt(document.getElementById('cfgCount').value) || 5;
        const order = document.getElementById('cfgOrder').value;
        const prioritize = document.getElementById('cfgPrioritize').checked;
        const onlyNew = document.getElementById('cfgOnlyNew').checked;
        const onlyFav = document.getElementById('cfgFavorites').checked;

        if (selectedTopics.length > 0) pool = pool.filter(q => selectedTopics.includes(q.topic));
        if (selectedSubtopics.length > 0) pool = pool.filter(q => selectedSubtopics.includes(q.subtopic));
        if (selectedLevels.length > 0) pool = pool.filter(q => selectedLevels.includes(q.level));
        if (selectedRevisions.length > 0) pool = pool.filter(q => selectedRevisions.includes(q.revisionType || 'regular'));
        if (onlyFav) pool = pool.filter(q => q.favorite);
        if (onlyNew) pool = pool.filter(q => !q.practiceCount || q.practiceCount === 0);

        if (pool.length === 0) { toast('No questions match your criteria', 'error'); return; }

        if (prioritize) pool.sort((a, b) => (a.practiceCount || 0) - (b.practiceCount || 0));
        if (order === 'random') { for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; } }

        const selected = pool.slice(0, Math.min(count, pool.length));
        practiceSession = { questions: selected, currentIndex: 0, results: [], flipped: false, active: true, finished: false };
        practiceSeconds = 0;
        clearInterval(practiceTimer);
        practiceTimer = setInterval(() => { practiceSeconds++; const el = document.querySelector('[data-timer]'); }, 1000);
        render();
    }

    function getSelectedChips(containerId) {
        const chips = document.querySelectorAll(`#${containerId} .chip.active`);
        return [...chips].map(c => c.dataset.topic || c.dataset.level || c.dataset.revision || c.dataset.subtopic || '').filter(Boolean);
    }

    function endPractice() {
        if (practiceSession) {
            practiceSession.active = false;
            practiceSession.finished = practiceSession.results.length > 0;
            clearInterval(practiceTimer);
        }
        render();
    }

    function retryWrong() {
        const wrong = practiceSession.results.filter(r => !r.known).map(r => r.question);
        if (wrong.length === 0) { toast('No wrong answers to retry', 'info'); return; }
        practiceSession = { questions: wrong, currentIndex: 0, results: [], flipped: false, active: true, finished: false };
        practiceSeconds = 0;
        clearInterval(practiceTimer);
        practiceTimer = setInterval(() => { practiceSeconds++; }, 1000);
        render();
    }

    function newSession() {
        practiceSession = null;
        clearInterval(practiceTimer);
        render();
    }

    // ==================== TOPICS ====================
    function renderTopics() {
        const topics = getTopics();
        const topicNames = Object.keys(topics).sort();

        return `
        <div style="margin-bottom:28px;" class="fade-up">
            <h2 style="font-size:28px; font-weight:700; letter-spacing:-0.5px;">Topics</h2>
            <p style="color:var(--muted); font-size:14px; margin-top:4px;">${topicNames.length} topics across your question bank</p>
        </div>
        ${topicNames.length === 0 ? `
            <div class="empty-state fade-up">
                <i class="fa-solid fa-folder-open"></i>
                <p style="font-size:16px; font-weight:500;">No topics yet</p>
                <p style="font-size:13px; margin-top:4px;">Add questions with topics to see them here.</p>
            </div>
        ` : `
        <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:16px;">
            ${topicNames.map((t, i) => {
                const subs = topics[t];
                const subEntries = Object.entries(subs);
                const qCount = subEntries.reduce((a,b) => a + b[1], 0);
                const easy = questions.filter(q => q.topic === t && q.level === 'easy').length;
                const med = questions.filter(q => q.topic === t && q.level === 'medium').length;
                const hard = questions.filter(q => q.topic === t && q.level === 'hard').length;
                const quick = questions.filter(q => q.topic === t && q.revisionType === 'quick').length;
                const regular = questions.filter(q => q.topic === t && q.revisionType === 'regular').length;
                const practiced = questions.filter(q => q.topic === t && q.practiceCount > 0).length;
                const color = topicColors[i % topicColors.length];
                return `
                <div class="card fade-up" style="cursor:pointer; border-top:3px solid ${color}; animation-delay:${i*0.05}s;" onclick="filterByTopic('${esc(t)}')">
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
                        <h3 style="font-size:17px; font-weight:700;">${esc(t)}</h3>
                        <span style="font-size:24px; font-weight:700; font-family:'Space Grotesk'; color:${color};">${qCount}</span>
                    </div>
                    <!-- Level bars -->
                    <div style="display:flex; gap:4px; margin-bottom:10px; height:6px; border-radius:3px; overflow:hidden; background:var(--border);">
