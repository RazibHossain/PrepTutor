                        ${easy ? `<div style="width:${easy/qCount*100}%; background:var(--easy); border-radius:3px 0 0 3px;" title="Easy: ${easy}"></div>` : ''}
                        ${med ? `<div style="width:${med/qCount*100}%; background:var(--medium);" title="Medium: ${med}"></div>` : ''}
                        ${hard ? `<div style="width:${hard/qCount*100}%; background:var(--hard); border-radius:0 3px 3px 0;" title="Hard: ${hard}"></div>` : ''}
                    </div>
                    <div style="display:flex; gap:12px; margin-bottom:12px; font-size:12px; color:var(--muted);">
                        <span><span style="color:var(--easy);">&#9679;</span> ${easy} Easy</span>
                        <span><span style="color:var(--medium);">&#9679;</span> ${med} Med</span>
                        <span><span style="color:var(--hard);">&#9679;</span> ${hard} Hard</span>
                    </div>
                    <!-- Revision breakdown -->
                    <div style="display:flex; gap:12px; margin-bottom:14px; font-size:12px; color:var(--muted);">
                        <span><i class="fa-solid fa-bolt" style="color:var(--quick); font-size:10px;"></i> ${quick} Quick</span>
                        <span><i class="fa-solid fa-book-open" style="color:var(--regular); font-size:10px;"></i> ${regular} Regular</span>
                    </div>
                    <!-- Subtopics -->
                    <div style="display:flex; flex-wrap:wrap; gap:6px;">
                        ${subEntries.map(([sub, cnt]) => `<span class="badge badge-sub">${esc(sub)} (${cnt})</span>`).join('')}
                    </div>
                    <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:12px; color:var(--muted);">${practiced}/${qCount} practiced</span>
                        <span style="font-size:12px; color:var(--accent);">View questions <i class="fa-solid fa-arrow-right" style="font-size:10px;"></i></span>
                    </div>
                </div>`;
            }).join('')}
        </div>`}`;
    }

    function filterByTopic(topic) {
        filters = { search: '', topic: topic, subtopic: '', level: '', revision: '', favorite: false };
        navigate('questions');
    }

    // ==================== MODAL ====================
    function openModal(id) {
        editingId = id || null;
        const modal = document.getElementById('questionModal');
        const title = document.getElementById('modalTitle');
        updateDatalists();

        if (id) {
            const q = questions.find(q => q.id === id);
            if (!q) return;
            title.textContent = 'Edit Question';
            document.getElementById('fTopic').value = q.topic;
            document.getElementById('fSubtopic').value = q.subtopic;
            document.getElementById('fQuestion').value = q.question;
            document.getElementById('fAnswer').value = q.answer;
            document.getElementById('fTags').value = q.tags.join(', ');
            document.getElementById('fFavorite').checked = q.favorite;
            selectLevel(q.level);
            selectRevision(q.revisionType || 'regular');
        } else {
            title.textContent = 'Add Question';
            document.getElementById('fTopic').value = '';
            document.getElementById('fSubtopic').value = '';
            document.getElementById('fQuestion').value = '';
            document.getElementById('fAnswer').value = '';
            document.getElementById('fTags').value = '';
            document.getElementById('fFavorite').checked = false;
            selectLevel('medium');
            selectRevision('regular');
        }
        modal.classList.add('open');
        setTimeout(() => document.getElementById('fTopic').focus(), 100);
    }

    function closeModal() { document.getElementById('questionModal').classList.remove('open'); editingId = null; }

    function selectLevel(level) {
        selectedLevel = level;
        document.querySelectorAll('#levelSelector .level-btn').forEach(b => {
            b.className = 'level-btn' + (b.dataset.level === level ? ` sel-${level}` : '');
        });
    }

    function selectRevision(rev) {
        selectedRevision = rev;
        document.querySelectorAll('#revSelector .rev-btn').forEach(b => {
            b.className = 'rev-btn' + (b.dataset.rev === rev ? ` sel-${rev}` : '');
        });
    }

    function updateDatalists() {
        const allTopics = [...new Set(questions.map(q => q.topic))].sort();
        document.getElementById('dlTopics').innerHTML = allTopics.map(t => `<option value="${esc(t)}">`).join('');
        updateSubtopicDatalist();
    }

    function updateSubtopicDatalist() {
        const topic = document.getElementById('fTopic').value.trim();
        const subs = topic ? getAllSubtopics(topic).sort() : getAllSubtopics().sort();
        document.getElementById('dlSubtopics').innerHTML = subs.map(s => `<option value="${esc(s)}">`).join('');
    }

    function saveQuestion() {
        const topic = document.getElementById('fTopic').value.trim();
        const subtopic = document.getElementById('fSubtopic').value.trim();
        const question = document.getElementById('fQuestion').value.trim();
        const answer = document.getElementById('fAnswer').value.trim();
        const tags = document.getElementById('fTags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
        const favorite = document.getElementById('fFavorite').checked;

        if (!topic) { toast('Please enter a topic', 'error'); return; }
        if (!question) { toast('Please enter a question', 'error'); return; }
        if (!answer) { toast('Please enter an answer', 'error'); return; }

        if (editingId) {
            const q = questions.find(q => q.id === editingId);
            if (q) {
                q.topic = topic; q.subtopic = subtopic || 'General'; q.question = question;
                q.answer = answer; q.level = selectedLevel; q.revisionType = selectedRevision;
                q.tags = tags; q.favorite = favorite;
            }
            toast('Question updated', 'success');
        } else {
            questions.push({
                id: genId(), question, answer, topic, subtopic: subtopic || 'General',
                level: selectedLevel, revisionType: selectedRevision, tags, favorite, createdAt: Date.now(),
                practiceCount: 0, lastPracticed: null, known: false
            });
            toast('Question added', 'success');
        }
        save(); closeModal(); render();
    }

    // ==================== IMPORT / EXPORT ====================
    function exportData() {
        const blob = new Blob([JSON.stringify(questions, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `prepforge_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click(); URL.revokeObjectURL(a.href);
        toast('Data exported successfully', 'success');
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (!Array.isArray(data)) throw new Error('Invalid format');
                // Validate each item has required fields
                data.forEach(q => {
                    if (!q.question || !q.answer || !q.topic) throw new Error('Invalid question format');
                });
                // Merge: add new, update existing by id
                let added = 0, updated = 0;
                data.forEach(imported => {
                    const existing = questions.find(q => q.id === imported.id);
                    if (existing) {
                        Object.assign(existing, imported);
                        if (!existing.revisionType) existing.revisionType = 'regular';
                        updated++;
                    } else {
                        imported.id = imported.id || genId();
                        imported.createdAt = imported.createdAt || Date.now();
                        imported.practiceCount = imported.practiceCount || 0;
                        imported.known = imported.known || false;
                        imported.favorite = imported.favorite || false;
                        imported.tags = imported.tags || [];
                        imported.revisionType = imported.revisionType || 'regular';
                        questions.push(imported);
                        added++;
                    }
                });
                save(); render();
                toast(`Imported: ${added} added, ${updated} updated`, 'success');
            } catch(err) {
                toast('Invalid file format: ' + err.message, 'error');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function clearAllData() {
        // Custom confirm using a temporary overlay
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay open';
        overlay.innerHTML = `
            <div class="modal" style="max-width:400px; text-align:center; padding:32px;">
                <i class="fa-solid fa-triangle-exclamation" style="font-size:40px; color:var(--danger); margin-bottom:16px;"></i>
                <h3 style="font-size:18px; font-weight:700; margin-bottom:8px;">Clear All Data?</h3>
                <p style="color:var(--muted); font-size:14px; margin-bottom:24px;">This will permanently delete all ${questions.length} questions. This cannot be undone.</p>
                <div style="display:flex; gap:10px; justify-content:center;">
                    <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                    <button class="btn btn-danger" onclick="confirmClearAll(this)">Delete Everything</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
    }

    function confirmClearAll(btn) {
        questions = [];
        save();
        practiceSession = null;
        clearInterval(practiceTimer);
        showAnswerMap = {};
        btn.closest('.modal-overlay').remove();
        render();
        toast('All data cleared', 'success');
    }

    // ==================== EVENT LISTENERS ====================
    function attachListeners() {
        // Search input
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => { filters.search = e.target.value; render(); e.target.focus(); });
        }

        // Filter dropdowns
        const filterTopic = document.getElementById('filterTopic');
        if (filterTopic) {
            filterTopic.addEventListener('change', (e) => { filters.topic = e.target.value; filters.subtopic = ''; render(); });
        }
        const filterSubtopic = document.getElementById('filterSubtopic');
        if (filterSubtopic) {
            filterSubtopic.addEventListener('change', (e) => { filters.subtopic = e.target.value; render(); });
        }
        const filterLevel = document.getElementById('filterLevel');
        if (filterLevel) {
            filterLevel.addEventListener('change', (e) => { filters.level = e.target.value; render(); });
        }
        const filterRevision = document.getElementById('filterRevision');
        if (filterRevision) {
            filterRevision.addEventListener('change', (e) => { filters.revision = e.target.value; render(); });
        }
        const filterFav = document.getElementById('filterFav');
        if (filterFav) {
            filterFav.addEventListener('click', () => { filters.favorite = !filters.favorite; render(); });
        }

        // Topic input change -> update subtopic datalist
        const fTopic = document.getElementById('fTopic');
        if (fTopic) fTopic.addEventListener('input', updateSubtopicDatalist);

        // Practice config: chip toggles
        setupChipToggle('cfgTopics', 'topic');
        setupChipToggle('cfgLevels', 'level');
        setupChipToggle('cfgRevisions', 'revision');
        setupChipToggle('cfgSubtopics', 'subtopic');

        // When topic chips change, update subtopic chips
        const cfgTopics = document.getElementById('cfgTopics');
        if (cfgTopics) {
            cfgTopics.addEventListener('click', () => {
                setTimeout(updatePracticeSubtopics, 10);
            });
        }
    }

    function setupChipToggle(containerId, dataAttr) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                e.preventDefault();
                const val = chip.dataset[dataAttr];
                if (val === '' || val === undefined) {
                    // "All" chip - deselect others
                    container.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                } else {
                    // Deselect "All" chip
                    container.querySelector('.chip[data-'+dataAttr+'=""]')?.classList.remove('active');
                    chip.classList.toggle('active');
                    // If nothing selected, reactivate "All"
                    if (!container.querySelector('.chip.active')) {
                        container.querySelector('.chip[data-'+dataAttr+'=""]')?.classList.add('active');
                    }
                }
            });
        });
    }

    function updatePracticeSubtopics() {
        const selectedTopics = getSelectedChips('cfgTopics');
        const wrap = document.getElementById('cfgSubtopicsWrap');
        const container = document.getElementById('cfgSubtopics');
        if (!wrap || !container) return;

        if (selectedTopics.length === 0) {
            wrap.style.display = 'none';
            return;
        }

        let subs = new Set();
        selectedTopics.forEach(t => getAllSubtopics(t).forEach(s => subs.add(s)));
        subs = [...subs].sort();

        if (subs.length === 0) {
            wrap.style.display = 'none';
            return;
        }

        wrap.style.display = 'block';
        container.innerHTML = `
            <label class="chip active" data-subtopic=""><i class="fa-solid fa-layer-group" style="font-size:10px;"></i> All Subtopics</label>
            ${subs.map(s => `<label class="chip" data-subtopic="${esc(s)}">${esc(s)}</label>`).join('')}
        `;
        setupChipToggle('cfgSubtopics', 'subtopic');
    }

    // ==================== KEYBOARD SHORTCUTS ====================
    document.addEventListener('keydown', (e) => {
        // Escape closes modal
        if (e.key === 'Escape') {
            const modal = document.getElementById('questionModal');
            if (modal.classList.contains('open')) { closeModal(); return; }
            // Close any clear-all confirm
            const confirm = document.querySelector('.modal-overlay.open:not(#questionModal)');
            if (confirm) { confirm.remove(); return; }
        }
        // Ctrl+N: new question (only if no modal/input focused)
        if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
            if (!document.getElementById('questionModal').classList.contains('open') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                e.preventDefault(); openModal();
            }
        }
        // Space: flip card in practice
        if (e.key === ' ' && practiceSession && practiceSession.active && !practiceSession.flipped && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
            e.preventDefault(); flipCard();
        }
    });

    // ==================== RESPONSIVE ====================
    function checkMobile() {
        const mobile = window.innerWidth <= 768;
        document.getElementById('mobileHeader').style.display = mobile ? 'flex' : 'none';
        document.getElementById('mainContent').style.paddingTop = mobile ? '72px' : '32px';
    }
    window.addEventListener('resize', checkMobile);

    // ==================== INIT ====================
    load();
    checkMobile();
    render();
    </script>
</body>
</html>
